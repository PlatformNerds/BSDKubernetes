name: freebsd-cross-build
# Builds the FreeBSD Kubernetes patch series (cross-compile, CGO_ENABLED=0).
# Nightly so upstream breakage (e.g. the possibleCPUs stub) is caught within a day.
on:
  push:
    paths: ["patches/**", "scripts/build-freebsd-k8s.sh", ".github/workflows/freebsd-cross-build.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: ./scripts/build-freebsd-k8s.sh "$RUNNER_TEMP/k8s-freebsd" ${{ matrix.arch }} | tee build.log
      - run: "! grep -q '^FAIL' build.log"
